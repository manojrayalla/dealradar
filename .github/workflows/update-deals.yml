name: Refresh DealRadar deals daily
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-deals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect deal feeds
        run: python scripts/update_deals.py
      - name: Commit refreshed catalogue
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          git commit -m "Refresh daily deal catalogue"
          git push
